name: Temporary GitHub Terminal Test

on:
  push:
    branches:
      - test/github-terminal-20261028

permissions:
  contents: read

jobs:
  terminal-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check shell and GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GITHUB_ACTIONS_SHELL_OK"
          echo "Working directory:"
          pwd
          echo "Runner OS:"
          uname -a
          echo "GitHub CLI version:"
          gh --version
          echo "GitHub API read-only smoke test:"
          gh api rate_limit --jq '.resources.core.limit'
